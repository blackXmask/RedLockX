<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" font-family="'Courier New', monospace">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#111827"/>
    </linearGradient>
    <linearGradient id="hybridGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0e3a4a"/>
      <stop offset="100%" style="stop-color:#0a2535"/>
    </linearGradient>
    <linearGradient id="mlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1040"/>
      <stop offset="100%" style="stop-color:#0e0a2a"/>
    </linearGradient>
    <linearGradient id="decisionGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a2535"/>
      <stop offset="100%" style="stop-color:#101820"/>
    </linearGradient>
    <linearGradient id="blockGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4a0d1a"/>
      <stop offset="100%" style="stop-color:#300810"/>
    </linearGradient>
    <linearGradient id="allowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0d3a1a"/>
      <stop offset="100%" style="stop-color:#082510"/>
    </linearGradient>
    <filter id="glow-cyan">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-red">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-green">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00e5ff"/>
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4b5563"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ff3366"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00c864"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="640" fill="url(#bgGrad)" rx="12"/>
  <rect width="900" height="640" fill="none" stroke="#1f2937" stroke-width="1.5" rx="12"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" fill="#00e5ff" font-size="15" font-weight="bold" letter-spacing="4" filter="url(#glow-cyan)">PROMPT INJECTION FIREWALL — DECISION PIPELINE</text>
  <line x1="60" y1="50" x2="840" y2="50" stroke="#1f2937" stroke-width="1"/>

  <!-- INPUT BOX -->
  <rect x="320" y="66" width="260" height="52" rx="6" fill="#0d1f2d" stroke="#00e5ff" stroke-width="1.5" filter="url(#glow-cyan)"/>
  <text x="450" y="87" text-anchor="middle" fill="#9ca3af" font-size="9" letter-spacing="2">INPUT</text>
  <text x="450" y="106" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="bold" letter-spacing="1">USER PROMPT</text>

  <!-- Split arrow down-left to Hybrid -->
  <line x1="365" y1="118" x2="200" y2="168" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow-gray)" stroke-dasharray="4,3"/>
  <!-- Split arrow down-right to ML -->
  <line x1="535" y1="118" x2="700" y2="168" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow-gray)" stroke-dasharray="4,3"/>
  <!-- Parallel label -->
  <text x="450" y="152" text-anchor="middle" fill="#6b7280" font-size="9" letter-spacing="2">PARALLEL EXECUTION</text>

  <!-- ── HYBRID LAYER BOX ── -->
  <rect x="50" y="172" width="300" height="185" rx="8" fill="url(#hybridGrad)" stroke="#00b8d4" stroke-width="1.5"/>
  <rect x="50" y="172" width="300" height="30" rx="8" fill="#0a2535"/>
  <rect x="50" y="188" width="300" height="14" fill="#0a2535"/>
  <text x="200" y="193" text-anchor="middle" fill="#00b8d4" font-size="10" font-weight="bold" letter-spacing="3">HYBRID LAYER</text>
  <text x="200" y="211" text-anchor="middle" fill="#4b9db8" font-size="8.5" letter-spacing="1">XGBoost Classifier + MiniLM Embeddings</text>

  <!-- Hybrid inputs -->
  <text x="70" y="235" fill="#6b7280" font-size="8.5" letter-spacing="1">INPUT</text>
  <text x="70" y="252" fill="#e2e8f0" font-size="9">▸ Raw prompt text</text>
  <line x1="65" y1="260" x2="335" y2="260" stroke="#1e3a4a" stroke-width="0.8"/>

  <text x="70" y="278" fill="#6b7280" font-size="8.5" letter-spacing="1">PROCESS</text>
  <text x="70" y="295" fill="#9ca3af" font-size="9">1. Encode with MiniLM → 384-dim vector</text>
  <text x="70" y="311" fill="#9ca3af" font-size="9">2. XGBoost classifies vector</text>
  <text x="70" y="327" fill="#9ca3af" font-size="9">3. Cosine similarity to known attacks</text>
  <line x1="65" y1="335" x2="335" y2="335" stroke="#1e3a4a" stroke-width="0.8"/>

  <text x="70" y="350" fill="#6b7280" font-size="8.5" letter-spacing="1">OUTPUT</text>
  <rect x="70" y="356" width="130" height="18" rx="3" fill="#0d2535" stroke="#00b8d4" stroke-width="0.8"/>
  <text x="135" y="369" text-anchor="middle" fill="#00e5ff" font-size="8.5" font-weight="bold">Risk %  (0 – 100)</text>

  <!-- ── ML LAYER BOX ── -->
  <rect x="550" y="172" width="300" height="185" rx="8" fill="url(#mlGrad)" stroke="#818cf8" stroke-width="1.5"/>
  <rect x="550" y="172" width="300" height="30" rx="8" fill="#0e0a2a"/>
  <rect x="550" y="188" width="300" height="14" fill="#0e0a2a"/>
  <text x="700" y="193" text-anchor="middle" fill="#818cf8" font-size="10" font-weight="bold" letter-spacing="3">ML LAYER</text>
  <text x="700" y="211" text-anchor="middle" fill="#5b5a8a" font-size="8.5" letter-spacing="1">DeBERTa-v3 Prompt Classifier</text>

  <text x="570" y="235" fill="#6b7280" font-size="8.5" letter-spacing="1">INPUT</text>
  <text x="570" y="252" fill="#e2e8f0" font-size="9">▸ Raw prompt text</text>
  <line x1="565" y1="260" x2="835" y2="260" stroke="#1e1a3a" stroke-width="0.8"/>

  <text x="570" y="278" fill="#6b7280" font-size="8.5" letter-spacing="1">PROCESS</text>
  <text x="570" y="295" fill="#9ca3af" font-size="9">1. Tokenize → transformer encoding</text>
  <text x="570" y="311" fill="#9ca3af" font-size="9">2. Binary classification (safe/dangerous)</text>
  <text x="570" y="327" fill="#9ca3af" font-size="9">3. Multi-label attack type detection</text>
  <line x1="565" y1="335" x2="835" y2="335" stroke="#1e1a3a" stroke-width="0.8"/>

  <text x="570" y="350" fill="#6b7280" font-size="8.5" letter-spacing="1">OUTPUT</text>
  <rect x="570" y="356" width="105" height="18" rx="3" fill="#120d2e" stroke="#818cf8" stroke-width="0.8"/>
  <text x="622" y="369" text-anchor="middle" fill="#a5b4fc" font-size="8.5" font-weight="bold">DANGEROUS / SAFE</text>
  <rect x="682" y="356" width="140" height="18" rx="3" fill="#120d2e" stroke="#818cf8" stroke-width="0.8"/>
  <text x="752" y="369" text-anchor="middle" fill="#a5b4fc" font-size="8.5" font-weight="bold">Confidence (0.0 – 1.0)</text>

  <!-- Arrows from model boxes down to Decision Engine -->
  <line x1="200" y1="357" x2="200" y2="400" stroke="#00b8d4" stroke-width="1.5"/>
  <line x1="200" y1="400" x2="388" y2="420" stroke="#00b8d4" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
  <line x1="700" y1="357" x2="700" y2="400" stroke="#818cf8" stroke-width="1.5"/>
  <line x1="700" y1="400" x2="512" y2="420" stroke="#818cf8" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>

  <!-- ── DECISION ENGINE BOX ── -->
  <rect x="225" y="418" width="450" height="115" rx="8" fill="url(#decisionGrad)" stroke="#00e5ff" stroke-width="1.5" filter="url(#glow-cyan)"/>
  <text x="450" y="440" text-anchor="middle" fill="#00e5ff" font-size="11" font-weight="bold" letter-spacing="3">DECISION ENGINE</text>
  <line x1="240" y1="447" x2="660" y2="447" stroke="#1f3a50" stroke-width="0.8"/>

  <!-- Risk formula -->
  <text x="450" y="466" text-anchor="middle" fill="#6b7280" font-size="9" letter-spacing="1">RISK SCORE FORMULA</text>
  <rect x="245" y="472" width="410" height="22" rx="4" fill="#0a1520" stroke="#1f3a50" stroke-width="1"/>
  <text x="450" y="487" text-anchor="middle" fill="#fbbf24" font-size="10" font-weight="bold" font-family="'Courier New', monospace">
    riskScore = (0.6 × HybridRisk%) + (0.4 × MLConfidence × 100)
  </text>

  <!-- BLOCK/ALLOW condition -->
  <text x="450" y="512" text-anchor="middle" fill="#6b7280" font-size="9" letter-spacing="1">BLOCK CONDITION  (either triggers BLOCK)</text>
  <rect x="245" y="518" width="190" height="20" rx="4" fill="#2a0d14" stroke="#ff3366" stroke-width="1"/>
  <text x="340" y="532" text-anchor="middle" fill="#ff6688" font-size="9.5" font-weight="bold">HybridRisk  &gt;  50%</text>
  <text x="450" y="530" text-anchor="middle" fill="#6b7280" font-size="11" font-weight="bold">OR</text>
  <rect x="465" y="518" width="190" height="20" rx="4" fill="#2a0d14" stroke="#ff3366" stroke-width="1"/>
  <text x="560" y="532" text-anchor="middle" fill="#ff6688" font-size="9.5" font-weight="bold">ML Status = "DANGEROUS"</text>

  <!-- Arrows down to BLOCK / ALLOW -->
  <line x1="360" y1="533" x2="280" y2="575" stroke="#ff3366" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <line x1="540" y1="533" x2="620" y2="575" stroke="#00c864" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- ── BLOCK BOX ── -->
  <rect x="130" y="575" width="220" height="52" rx="8" fill="url(#blockGrad)" stroke="#ff3366" stroke-width="2" filter="url(#glow-red)"/>
  <text x="240" y="598" text-anchor="middle" fill="#ff3366" font-size="16" font-weight="bold" letter-spacing="5">BLOCK</text>
  <text x="240" y="616" text-anchor="middle" fill="#9ca3af" font-size="9">Request denied — threat detected</text>

  <!-- ── ALLOW BOX ── -->
  <rect x="550" y="575" width="220" height="52" rx="8" fill="url(#allowGrad)" stroke="#00c864" stroke-width="2" filter="url(#glow-green)"/>
  <text x="660" y="598" text-anchor="middle" fill="#00c864" font-size="16" font-weight="bold" letter-spacing="5">ALLOW</text>
  <text x="660" y="616" text-anchor="middle" fill="#9ca3af" font-size="9">Request passed — no injection found</text>

  <!-- Weight labels on the incoming arrows to decision engine -->
  <rect x="130" y="378" width="80" height="16" rx="3" fill="#0d1f2d" stroke="#00b8d4" stroke-width="0.8"/>
  <text x="170" y="390" text-anchor="middle" fill="#00b8d4" font-size="8.5">weight: 60%</text>
  <rect x="690" y="378" width="80" height="16" rx="3" fill="#120d2e" stroke="#818cf8" stroke-width="0.8"/>
  <text x="730" y="390" text-anchor="middle" fill="#818cf8" font-size="8.5">weight: 40%</text>

  <!-- Bottom label -->
  <text x="450" y="636" text-anchor="middle" fill="#374151" font-size="8" letter-spacing="2">blackXmask/RedLockX — XGBoost + MiniLM · DeBERTa-v3</text>
</svg>
